name: tock-nightly-ci

on:
  schedule:
  - cron: "0 0 * * *"

  # Allow this workflow to be invoked manually, for an arbitrary ref
  # (useful for testing PRs, etc)
  workflow_dispatch:

env:
  TERM: xterm # Makes tput work in actions output

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# If you add additional jobs, remember to add them to bors.toml
permissions:
  contents: read
  issues: write

jobs:
  ci-build:
    # Do not run job on forks
    if: github.repository == 'tock/tock'

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: ci-job-syntax
        run: make ci-job-syntax

      - name: ci-job-compilation
        run: make ci-job-compilation

      - name: ci-job-debug-support-targets
        run: make ci-job-debug-support-targets

      - name: ci-job-collect-artifacts
        run: make ci-job-collect-artifacts

      - name: upload-build-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: tools/ci/ci-artifacts

      - name: Create Issue on Failed Workflow
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/ci_nightly_failure_issue_template.md

  ci-tests:
    # Do not run job on forks
    if: github.repository == 'tock/tock'

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Update package repositories
        run: |
          sudo apt update
        if: matrix.os == 'ubuntu-latest'
      - name: Install dependencies for ubuntu-latest
        run: |
          sudo apt install -q libudev-dev libzmq3-dev
        if: matrix.os == 'ubuntu-latest'
      - name: Install dependencies for macos-latest
        run: |
          brew install zeromq
        if: matrix.os == 'macos-latest'
      - uses: actions/checkout@v4
      - name: ci-job-libraries
        run: make ci-job-libraries
      - name: ci-job-archs
        run: make ci-job-archs
      - name: ci-job-kernel
        run: make ci-job-kernel
      - name: ci-job-chips
        run: make ci-job-chips
      - name: ci-job-tools
        run: make ci-job-tools

      - name: Create Issue on Failed Workflow
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/ci_nightly_failure_issue_template.md

  ci-docs:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      statuses: write # For the `docs-preview` status on pull requests.
    # The build runs in ~2 minutes; the upload of ~27k files is the slow half
    # and Netlify warns it can take "many minutes" at that count. This is only
    # here so a wedged deploy fails in half an hour instead of six.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # In all cases, do a build and verify there are no doc warnings.
      - name: ci-runner-docs
        run: make ci-runner-docs

      # Pull requests from a branch on tock/tock get a preview deploy. PRs from
      # forks do not as they don't have access to secrets (for netlify tokens).
      - name: Deploy preview to Netlify
        id: preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Deploys are "draft" by default (i.e., no `--prod` -> no publish)
        #  --dir directory to publish
        #  --no-build netlify doesn't do the build, just accepts the upload
        #  --json for machine-processing of response
        #  --alias creates a persistent URL for this PR
        #  --message human handle for Netlify UX use
        run: |
          npx --yes netlify-cli@27.4.1 deploy \
            --dir=doc/rustdoc \
            --no-build \
            --json \
            --alias="pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER @ $GITHUB_SHA" > "$RUNNER_TEMP/deploy.json"
          # Only .deploy_url -- .url is the site's production URL.
          url=$(jq -r '.deploy_url // empty' "$RUNNER_TEMP/deploy.json")
          if [ -z "$url" ]; then
            echo "no deploy_url in netlify output:" >&2
            cat "$RUNNER_TEMP/deploy.json" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Docs preview: $url" >> "$GITHUB_STEP_SUMMARY"

      # Netlify used to report its own deploy-preview check here. Keep the
      # preview one click from checks list, rather than buried in job summary.
      - name: Link the preview from a commit status
        if: ${{ !cancelled() && steps.preview.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          if [ -n "$URL" ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=success \
              -f context=docs-preview \
              -f description="Documentation preview" \
              -f target_url="$URL"
          else
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=failure \
              -f context=docs-preview \
              -f description="Preview deploy failed"
          fi

      # Pushes to master publish to production.
      - name: Deploy to Netlify
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # --dir: What to publish
        # --prod: Push to production
        # --no-build: Don't build anything
        # --message: Label for netlify for this upload
        run: |
          npx --yes netlify-cli@27.4.1 deploy \
            --dir=doc/rustdoc \
            --prod \
            --no-build \
            --message "master @ $GITHUB_SHA"
